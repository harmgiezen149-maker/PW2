name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "minimalist-launcher/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: minimalist-launcher

jobs:
  build:
    runs-on: ubuntu-latest # Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build, lint and test
        run: gradle --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimalist-launcher-debug-apk
          path: minimalist-launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: minimalist-launcher/app/build/reports
