name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "minimalist-launcher/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: minimalist-launcher

permissions:
  contents: write # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest # Android SDK preinstalled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build, lint and test
        run: gradle --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimalist-launcher-debug-apk
          path: minimalist-launcher/app/build/outputs/apk/debug/app-debug.apk

      # Workflow artifacts are only downloadable while signed in to GitHub, so
      # the APK also goes to a rolling release: that link works signed out and
      # always points at the newest build.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk minimalist-launcher.apk
          # Download scanners like to park a .apk at 99% while inspecting it, so
          # the same build also ships zipped: not an installable package, so it
          # comes through untouched.
          zip -q minimalist-launcher-apk.zip minimalist-launcher.apk
          gh release create latest \
            --title "Latest build" \
            --notes "Automatic build" || true
          gh release upload latest \
            minimalist-launcher.apk minimalist-launcher-apk.zip --clobber
          # Size and checksum make a stalled, partial download recognisable.
          cat > notes.md <<NOTES
          Automatic build of ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M') UTC

          | file | bytes |
          | --- | --- |
          | minimalist-launcher.apk | $(stat -c%s minimalist-launcher.apk) |
          | minimalist-launcher-apk.zip | $(stat -c%s minimalist-launcher-apk.zip) |

          sha256 of the APK: $(sha256sum minimalist-launcher.apk | cut -d' ' -f1)
          NOTES
          # Not a prerelease: that keeps /releases/latest/ working and puts the
          # download on the repository's front page.
          gh release edit latest --prerelease=false --notes-file notes.md

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: minimalist-launcher/app/build/reports
