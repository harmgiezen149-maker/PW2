<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boswachter Assistent · Planken Wambuis</title>
<meta name="description" content="Boswachter Assistent voor Planken Wambuis (Natuurmonumenten): gecontroleerde gebiedskennis voor boswachters en vrijwilligers.">
<meta name="theme-color" content="#2256A0">
<link rel="manifest" href="/api/achtergrond?manifest=1">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planken Wambuis">
<link rel="preload" href="/assets/fonts/fira-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/fira-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/app.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="app">
  <header class="kop">
    <button type="button" class="kop-terug" id="kopTerug" aria-label="Terug" hidden></button>
    <div class="kop-logo" id="kopLogo"></div>
    <h1 class="kop-titel" id="kopTitel">Boswachter Assistent</h1>
    <div class="kop-rechts">
      <button type="button" class="schakel-knop" id="storyToggle" aria-pressed="false" title="Antwoorden als verhaal voor bezoekers">Verhaal<span class="schakel" aria-hidden="true"></span></button>
    </div>
  </header>

  <main id="views">
    <!-- Chat -->
    <section class="view view-chat" id="view-chat" aria-label="Chat">
      <div class="landschap" aria-hidden="true"></div>
      <button type="button" class="weerbalk" id="weerbalk" aria-expanded="false" aria-controls="weerDagen">
        <span id="wIcoon"></span>
        <span class="weerbalk-tekst">
          <span class="weerbalk-plaats">Planken Wambuis</span>
          <span class="weerbalk-nu" id="wNu">Weer laden…</span>
        </span>
        <svg class="weerbalk-pijl" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="weer-dagen" id="weerDagen" hidden></div>
      <div class="fout" id="err" role="alert" hidden></div>
      <div id="chat">
        <div class="chat-inhoud" id="chatInhoud">
          <div class="groet">
            <div class="avatar avatar-groot" id="groetAvatar"></div>
            <div class="groet-kaart">
              <h2 class="groet-titel" id="greet"></h2>
              <p class="groet-tekst" id="weldate"></p>
              <div class="suggesties" id="suggesties"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="invoer">
        <div class="invoer-rij">
          <button type="button" class="plus-knop" id="plusKnop" aria-label="Onderwerpen en snelle vragen"></button>
          <label for="txt" class="sr-only">Stel een vraag</label>
          <textarea id="txt" rows="1" placeholder="Stel een vraag…" enterkeyhint="send"></textarea>
          <button type="button" id="btn" aria-label="Versturen"></button>
        </div>
      </div>
    </section>

    <!-- Kaart -->
    <section class="view view-kaart" id="view-kaart" aria-label="Kaart" hidden></section>

    <!-- Gebieden -->
    <section class="view" id="view-gebieden" aria-label="Gebieden" hidden></section>
    <section class="view" id="view-gebied" aria-label="Gebied" hidden></section>

    <!-- Meldingen -->
    <section class="view" id="view-kalender" aria-label="Kalender" hidden></section>
    <section class="view" id="view-meldingen" aria-label="Meldingen" hidden></section>

    <!-- Profiel -->
    <section class="view" id="view-profiel" aria-label="Profiel" hidden></section>
  </main>

  <nav class="tabbalk" id="tabbalk" aria-label="Hoofdmenu"></nav>
</div>

<script src="/assets/core.js"></script>
<script src="/assets/vogels.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/kaart.js"></script>
<script src="/assets/gebieden.js"></script>
<script src="/assets/kalender.js"></script>
<script src="/assets/meldingen.js"></script>
<script src="/assets/profiel.js"></script>
<script>
  document.getElementById('groetAvatar').innerHTML = PW.AVATAR;
  PW.start();
</script>
</body>
</html>
